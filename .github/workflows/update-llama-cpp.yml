name: Update llama.cpp submodule

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  update-submodule:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        ref: new_build_wip

    - name: Check for submodule updates
      id: check
      run: |
        cd llama.cpp

        CURRENT_COMMIT=$(git rev-parse HEAD)
        echo "Current commit: $CURRENT_COMMIT"

        git fetch origin master

        LATEST_COMMIT=$(git rev-parse origin/master)
        echo "Latest commit: $LATEST_COMMIT"

        if [ "$CURRENT_COMMIT" != "$LATEST_COMMIT" ]; then
          echo "needs_update=true" >> "$GITHUB_OUTPUT"
          echo "current_commit=$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "latest_commit=$LATEST_COMMIT" >> "$GITHUB_OUTPUT"
          echo "current_short=$(echo $CURRENT_COMMIT | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "latest_short=$(echo $LATEST_COMMIT | cut -c1-7)" >> "$GITHUB_OUTPUT"
        else
          echo "needs_update=false" >> "$GITHUB_OUTPUT"
          echo "Submodule is up to date"
        fi

    - name: Create issue for Copilot
      if: steps.check.outputs.needs_update == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Check if an issue already exists for this update
        EXISTING_ISSUE=$(gh issue list --search "Update llama.cpp submodule to ${{ steps.check.outputs.latest_short }}" --state open --json number --jq '.[0].number')
        if [ -n "$EXISTING_ISSUE" ]; then
          echo "Issue #$EXISTING_ISSUE already exists for this update, skipping"
          exit 0
        fi

        # Create an issue and assign it to Copilot
        gh issue create \
          --title "Update llama.cpp submodule to ${{ steps.check.outputs.latest_short }}" \
          --assignee "daavoo" \
          --body "A new version of llama.cpp is available. Please update the submodule from \`${{ steps.check.outputs.current_short }}\` to \`${{ steps.check.outputs.latest_short }}\` and make necessary adjustments.

        ## Step 1: Update the submodule

        \`\`\`bash
        cd llama.cpp
        git fetch origin master
        git checkout origin/master
        cd ..
        git add llama.cpp
        \`\`\`

        ## Step 2: Verify and update patches

        - Review the patches in \`llama.cpp.patches/patches/\`
        - Check if each patch still applies cleanly to the new llama.cpp version
        - Update any patches that have conflicts due to upstream changes
        - Run the patch application script to verify:
          \`\`\`bash
          cd llama.cpp.patches && ./apply-patches.sh
          \`\`\`

        ## Step 3: Update BUILD.mk dependencies

        - Review \`llama.cpp/BUILD.mk\` for any new source files or dependencies added upstream
        - Remove references to any deleted source files
        - Ensure all new dependencies are properly included
        - Check the upstream changes for new/removed files in \`llama.cpp/src/\`, \`llama.cpp/common/\`, \`llama.cpp/ggml/\`

        ## Step 4: Update llamafile integration code

        - Check if the llamafile code that calls llama.cpp server/main needs updates
        - Review \`llamafile/\` for any API changes in llama.cpp that need to be reflected
        - Pay attention to changes in \`llama.cpp/include/\` for API modifications

        ## Verification

        After making changes, verify the build works:
        \`\`\`bash
        make clean
        make -j\$(nproc)
        \`\`\`

        ## Reference

        - **Upstream changes:** https://github.com/ggerganov/llama.cpp/compare/${{ steps.check.outputs.current_commit }}...${{ steps.check.outputs.latest_commit }}
        - **Example PR with similar updates:** https://github.com/mozilla-ai/llamafile/pull/847

        ---
        *This issue was automatically created by the update-llama-cpp workflow.*"
